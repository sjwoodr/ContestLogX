name: Build and Test ContestLogX

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtnetworkauth qtserialport qtmultimedia'
          cache: true

      - name: Install additional dependencies
        run: sudo apt-get install -y libxml2-dev

      - name: Download DXCC database (cty.dat)
        run: |
          mkdir -p ~/.local/share/ContestLogX
          curl -s -L https://www.country-files.com/cty/cty.dat.gz -o /tmp/cty.dat.gz
          gunzip -f /tmp/cty.dat.gz
          mv /tmp/cty.dat ~/.local/share/ContestLogX/cty.dat
          ls -lh ~/.local/share/ContestLogX/cty.dat

      - name: Build with make
        run: make

      - name: Run unit tests
        run: make test
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run log tests
        run: make test-logs-headless
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Verify clx binary exists
        run: |
          ls -la clx
          file clx

      - name: Test clx --help (headless)
        run: QT_QPA_PLATFORM=offscreen ./clx --help
        timeout-minutes: 1
