name: Build and Test ContestLogX

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtnetworkauth qtmultimedia'
          cache: true

      - name: Install additional dependencies
        run: sudo apt-get install -y libxml2-dev

      - name: Download DXCC database (cty.dat)
        run: |
          mkdir -p ~/.local/share/ContestLogX
          curl -s -L https://www.country-files.com/cty/cty.dat -o /tmp/cty.dat
          mv /tmp/cty.dat ~/.local/share/ContestLogX/cty.dat
          ls -lh ~/.local/share/ContestLogX/cty.dat

      - name: Build with make
        run: make

      - name: Run unit tests
        run: make test
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run log tests
        run: make test-logs-headless
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Verify clx binary exists
        run: |
          ls -la clx
          file clx

      - name: Test clx --help (headless)
        run: QT_QPA_PLATFORM=offscreen ./clx --help
        timeout-minutes: 1

  build-appimage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          VERSION=$(grep 'project(ContestLogX VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build AppImage
        run: |
          mkdir -p dist
          docker build -f Dockerfile.appimage -t clx-appimage-builder .
          docker run --rm -v $(pwd)/dist:/output clx-appimage-builder

      - name: Rename and compress AppImage
        run: |
          cd dist
          APPIMAGE=$(ls ContestLogX-*.AppImage)
          COMPRESSED_NAME="ContestLogX.${{ steps.version.outputs.version }}.AppImage.tar.gz"
          tar -czf "$COMPRESSED_NAME" "$APPIMAGE"
          ls -lh
          echo "COMPRESSED_ARTIFACT=$COMPRESSED_NAME" >> $GITHUB_ENV

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/ContestLogX.${{ steps.version.outputs.version }}.AppImage.tar.gz
          retention-days: 1  # Intermediate — attached to Release by create-release job

  build-macos:
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          VERSION=$(grep 'project(ContestLogX VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION: $VERSION"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          host: 'mac'
          target: 'desktop'
          modules: 'qtnetworkauth qtmultimedia'
          cache: true

      - name: Build macOS app bundle
        run: |
          chmod +x scripts/build-macos-bundle.sh
          scripts/build-macos-bundle.sh

      - name: Compress app bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          TARBALL_NAME="ContestLogX.${VERSION}.macOS.tar.gz"
          tar -czf "$TARBALL_NAME" "ContestLogX.app"
          ls -lh
          echo "MACOS_ARTIFACT=$TARBALL_NAME" >> $GITHUB_ENV

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/ContestLogX.${{ steps.version.outputs.version }}.macOS.tar.gz
          retention-days: 1  # Intermediate — attached to Release by create-release job

  build-windows:
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from CMakeLists.txt
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'project(ContestLogX VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION: $VERSION"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtnetworkauth qtmultimedia'
          cache: true

      - name: Build Windows distribution
        shell: pwsh
        run: scripts/build-windows.ps1

      - name: Compress Windows distribution
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          7z a -tzip "ContestLogX.${VERSION}.Windows.zip" ContestLogX/
          ls -lh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/ContestLogX.${{ steps.version.outputs.version }}.Windows.zip
          retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-appimage, build-macos, build-windows]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          VERSION=$(grep 'project(ContestLogX VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION: $VERSION"

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: artifacts/

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version (between its heading and the next heading)
          NOTES=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry for v$VERSION."
          fi
          # Use GH delimiter for multiline output
          echo "notes<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            ## Downloads
            - **Linux AppImage**: ContestLogX.${{ steps.version.outputs.version }}.AppImage.tar.gz
            - **macOS App Bundle**: ContestLogX.${{ steps.version.outputs.version }}.macOS.tar.gz
            - **Windows**: ContestLogX.${{ steps.version.outputs.version }}.Windows.zip
          draft: false
          prerelease: false
          files: |
            artifacts/ContestLogX.${{ steps.version.outputs.version }}.AppImage.tar.gz
            artifacts/ContestLogX.${{ steps.version.outputs.version }}.macOS.tar.gz
            artifacts/ContestLogX.${{ steps.version.outputs.version }}.Windows.zip
